services:
  vscode:
    image: lscr.io/linuxserver/openvscode-server:latest
    container_name: vscode
    volumes:
      - /docker/vscode/config:/config
      - /docker:/config/workspace
    ports:
      - 9003:3000
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - homeassistant

  tugtainer:
    image: ghcr.io/quenary/tugtainer:1
    container_name: tugtainer
    restart: unless-stopped
    ports:
      - 9011:80
    environment:
      AGENT_SECRET: ${TUGTAINER_AGENT_SECRET}
      JWT_SECRET_KEY: ${TUGTAINER_JWT_SECRET_KEY}
      ACCESS_TOKEN_LIFETIME_MIN: "60"
      ENABLE_PUBLIC_API: "true"
      NOTIFICATION_ALLOW_ENDPOINTS: mailserver:25
    volumes:
      - /docker/tugtainer/data:/tugtainer
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      dev.quenary.tugtainer.protected: "true"
    networks:
      - homeassistant

  duplicati:
    image: duplicati/duplicati
    container_name: duplicati
    restart: unless-stopped
    command: /opt/duplicati/duplicati-server --disable-db-encryption --webservice-allowed-hostnames=* --log-level=Information --log-console=true
    ports:
      - "9004:8200"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - /docker/duplicati/config:/config
      - /docker/duplicati/data:/data
      - /docker:/source:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8200/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - homeassistant

  adguard:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped
    volumes:
      - /docker/adguard/work:/opt/adguardhome/work
      - /docker/adguard/conf:/opt/adguardhome/conf
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9005/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mailserver:
    image: miguellobato84/smtp-gmail-relay:latest
    container_name: mailserver
    environment:
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"127.0.0.1\",25),5); s.close()'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - homeassistant

  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    restart: unless-stopped
    container_name: speedtest-tracker
    ports:
      - 9006:80
    environment:
      - PUID=1000
      - PGID=1000
      - APP_KEY=${SPEEDTEST_APP_KEY}
      - ADMIN_PASSWORD=${SPEEDTEST_ADMIN_PASSWORD}
      - DB_CONNECTION=sqlite
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailserver
      - MAIL_PORT=25
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME="Speedtest Tracker"
      - MAIL_SCHEME=null
      - SPEEDTEST_SCHEDULE=6 */2 * * *
      - APP_TIMEZONE=Europe/Madrid
    volumes:
      - /docker/speedtest/data:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - homeassistant

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*"
      HOMEPAGE_VAR_ADGUARD_PASSWORD: ${HOMEPAGE_VAR_ADGUARD_PASSWORD}
      HOMEPAGE_VAR_ADGUARD_USERNAME: ${HOMEPAGE_VAR_ADGUARD_USERNAME}
      HOMEPAGE_VAR_BAZARR_KEY: ${HOMEPAGE_VAR_BAZARR_KEY}
      HOMEPAGE_VAR_CLOUDFLARE_KEY: ${HOMEPAGE_VAR_CLOUDFLARE_KEY}
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_VAR_JELLYFIN_KEY}
      HOMEPAGE_VAR_NGINX_PASSWORD: ${HOMEPAGE_VAR_NGINX_PASSWORD}
      HOMEPAGE_VAR_NGINX_USERNAME: ${HOMEPAGE_VAR_NGINX_USERNAME}
      HOMEPAGE_VAR_NETALERTX: ${HOMEPAGE_VAR_NETALERTX}
      HOMEPAGE_VAR_PORTAINER_KEY: ${HOMEPAGE_VAR_PORTAINER_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_VAR_PROWLARR_KEY}
      HOMEPAGE_VAR_RADARR_KEY: ${HOMEPAGE_VAR_RADARR_KEY}
      HOMEPAGE_VAR_SONARR_KEY: ${HOMEPAGE_VAR_SONARR_KEY}
      HOMEPAGE_VAR_SPEEDTEST_TRACKER_KEY: ${HOMEPAGE_VAR_SPEEDTEST_TRACKER_KEY}
      PUID: 1000 # optional, your user id
      PGID: 1000 # optional, your group id
    ports:
      - 9007:3000
    volumes:
      - /docker/homepage/config:/app/config # Make sure your local config directory exists
    restart: unless-stopped
    networks:
      - homeassistant

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      - CONTAINERS=1 # Allow access to viewing containers
      - SERVICES=1 # Allow access to viewing services (necessary when using Docker Swarm)
      - TASKS=1 # Allow access to viewing tasks (necessary when using Docker Swarm)
      - POST=0 # Disallow any POST operations (effectively read-only)
    ports:
      - 9008:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mounted as read-only
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:2375/_ping | grep -qx OK"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - homeassistant

networks:
  homeassistant:
    external: true
