- id: '1771221191925'
  alias: humidity_rise_extractor_bano
  description: Start only after a sustained shower-like humidity rise, with a one-hour cooldown.
  triggers:
  - trigger: template
    value_template: >-
      {% set humidity = states('sensor.sensor_temp_banod_humidity') %}
      {% set baseline = states('sensor.humedad_bano_media_movil_1h') %}
      {{ has_value('sensor.sensor_temp_banod_humidity')
         and has_value('sensor.humedad_bano_media_movil_1h')
         and is_number(humidity) and is_number(baseline)
         and 0 < (baseline | float(0)) <= 100
         and 75 <= (humidity | float(0)) <= 100
         and (humidity | float(0)) >= (baseline | float(0)) + 12
         and (humidity | float(0)) >= (baseline | float(0)) * 1.20 }}
    for: '00:03:00'
  conditions:
  - condition: state
    entity_id: switch.extractor_bano
    state: 'off'
  - condition: template
    value_template: >-
      {{ as_timestamp(now())
         - as_timestamp(this.attributes.last_triggered, 0) >= 3600 }}
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.extractor_bano
  mode: single
