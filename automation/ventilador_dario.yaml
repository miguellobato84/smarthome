- id: '1770660424312'
  alias: ventilador_dario
  description: Toggle Dario fan/light from detached wall switch.
  triggers:
  - domain: mqtt
    device_id: ef38534b5974f287ab36ab0d9bae35d3
    type: action
    subtype: toggle
    trigger: device
  conditions: []
  actions:
  - variables:
      fan_percentage: >-
        {% set temp = state_attr('climate.radiador_dario', 'current_temperature') | float(0) %}
        {% if temp >= 29 %}
          50
        {% elif temp >= 26 %}
          33
        {% else %}
          16
        {% endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: >
          {{ is_state('fan.tuya_ventilador_dario', 'on')
             or is_state('light.tuya_ventilador_dario', 'on') }}
      sequence:
      - target:
          entity_id: fan.tuya_ventilador_dario
        action: fan.turn_off
      - target:
          entity_id: light.tuya_ventilador_dario
        action: light.turn_off
    default:
    - target:
        entity_id: fan.tuya_ventilador_dario
      action: fan.turn_on
    - target:
        entity_id: fan.tuya_ventilador_dario
      data:
        percentage: '{{ fan_percentage | int }}'
      action: fan.set_percentage
  mode: single
