- id: '1780798200000'
  alias: globo_dario
  description: Mirror Globo Dario switch state to Globito light.
  triggers:
  - trigger: state
    entity_id: switch.globo_dario
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.globo_dario
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.luz_globito
    - conditions:
      - condition: state
        entity_id: switch.globo_dario
        state: 'off'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.luz_globito
  mode: single
