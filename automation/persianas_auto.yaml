- id: '1771866324220'
  alias: persianas_auto
  description: Schedule automatic blind positions for morning, afternoon, and bedtime.
  triggers:
  - trigger: time
    at: input_datetime.alarm
    id: alarm
  - trigger: time
    at: "14:00:00"
    id: afternoon
  - trigger: time
    at: input_datetime.go_to_bed
    id: go_to_bed
  conditions: []
  actions:
  - if:
    - condition: time
      after: input_datetime.alarm
      before: "14:00:00"
    then:
    - action: cover.set_cover_position
      target:
        entity_id:
        - cover.persiana_estudio
        - cover.persiana_dario
      data:
        position: 100
  - if:
    - condition: time
      after: "14:00:00"
      before: input_datetime.go_to_bed
    then:
    - action: cover.set_cover_position
      target:
        entity_id: cover.persiana_estudio
      data:
        position: "{{ [30, state_attr('cover.persiana_estudio', 'current_position') | int(30)] | min }}"
    - action: cover.set_cover_position
      target:
        entity_id: cover.persiana_dario
      data:
        position: "{{ [30, state_attr('cover.persiana_dario', 'current_position') | int(30)] | min }}"
    - action: cover.set_cover_position
      target:
        entity_id: cover.persiana_dormitorio_small
      data:
        position: "{{ [30, state_attr('cover.persiana_dormitorio_small', 'current_position') | int(30)] | min }}"
    - action: cover.set_cover_position
      target:
        entity_id: cover.persiana_dormitorio_big
      data:
        position: "{{ [30, state_attr('cover.persiana_dormitorio_big', 'current_position') | int(30)] | min }}"
  - if:
    - condition: time
      after: input_datetime.go_to_bed
      before: input_datetime.alarm
    then:
    - action: cover.set_cover_position
      target:
        entity_id:
        - cover.persiana_dormitorio_small
        - cover.persiana_dormitorio_big
        - cover.persiana_dario
      data:
        position: 0
    - action: cover.set_cover_position
      target:
        entity_id: cover.persiana_estudio
      data:
        position: 30
  mode: single
