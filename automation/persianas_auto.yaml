- id: '1771866324220'
  alias: persianas_auto
  description: Open the office and Dario blinds to 80% at alarm and close them one hour after dusk.
  triggers:
  - trigger: time
    at: input_datetime.alarm
    id: alarm
  - trigger: state
    entity_id: sensor.sun_next_dusk
    for: "01:00:00"
    id: dusk_changed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
        data:
          position: 80
    - conditions:
      - condition: trigger
        id: dusk_changed
      sequence:
      - action: cover.close_cover
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
  mode: single
