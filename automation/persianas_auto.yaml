- id: '1771866324220'
  alias: persianas_auto
  description: Schedule automatic blind positions for morning, afternoon, and bedtime.
  triggers:
  - trigger: time
    at: input_datetime.alarm
    id: alarm
  - trigger: time
    at: "09:00:00"
    id: morning_bedroom
  - trigger: time
    at: "14:00:00"
    id: afternoon
  - trigger: time
    at: input_datetime.go_to_bed
    id: go_to_bed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
        data:
          position: 100
    - conditions:
      - condition: trigger
        id: morning_bedroom
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_dormitorio_small
          - cover.persiana_dormitorio_big
        data:
          position: 100
    - conditions:
      - condition: trigger
        id: afternoon
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
          - cover.persiana_dormitorio_small
          - cover.persiana_dormitorio_big
        data:
          position: 30
    - conditions:
      - condition: trigger
        id: go_to_bed
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_dormitorio_small
          - cover.persiana_dormitorio_big
          - cover.persiana_dario
        data:
          position: 0
      - action: cover.set_cover_position
        target:
          entity_id: cover.persiana_estudio
        data:
          position: 30
  mode: single
