- id: '1771866324220'
  alias: persianas_auto
  description: Open the office and Dario blinds to 80% at alarm and close them one hour after dusk.
  triggers:
  - trigger: time
    at: input_datetime.alarm
    id: alarm
  - trigger: state
    entity_id: sensor.sun_next_dusk
    id: dusk_changed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
        data:
          position: 80
    - conditions:
      - condition: trigger
        id: dusk_changed
      - condition: template
        value_template: >-
          {{ has_value('sensor.sun_next_dusk')
             and trigger.from_state is not none
             and as_timestamp(trigger.from_state.state, 0) > 0
             and as_timestamp(trigger.from_state.state, 0) <= as_timestamp(now()) }}
      sequence:
      - delay:
          seconds: >-
            {{ [as_timestamp(trigger.from_state.state) + 3600 - as_timestamp(now()), 0] | max | int }}
      - action: cover.close_cover
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
  mode: single
