- id: '1771866324220'
  alias: persianas_auto
  description: Open the office and Dario blinds to 90% at alarm on workdays; close all three blinds one hour after dusk every day.
  triggers:
  - trigger: time
    at: input_datetime.alarm
    id: alarm
  - trigger: sun.dusk
    options:
      type: civil
      offset: "01:00:00"
      offset_type: after
    id: dusk
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm
      - condition: state
        entity_id: binary_sensor.workday_sensor_es_md
        state: 'on'
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
        data:
          position: 90
    - conditions:
      - condition: trigger
        id: dusk
      sequence:
      - action: cover.close_cover
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
          - cover.persiana_dormitorio_small
  mode: single
