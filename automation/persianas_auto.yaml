- id: '1771866324220'
  alias: persianas_auto
  description: On weekdays, open the office and Dario blinds to 90% at alarm and close them one hour after dusk. Skip both actions on weekends.
  triggers:
  - trigger: time
    at: input_datetime.alarm
    id: alarm
  - trigger: sun.dusk
    options:
      type: civil
      offset: "01:00:00"
      offset_type: after
    id: dusk
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
        data:
          position: 90
    - conditions:
      - condition: trigger
        id: dusk
      sequence:
      - action: cover.close_cover
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
  mode: single
