- id: '1771866324220'
  alias: persianas_auto
  description: Open the office and Dario blinds to 80% at alarm and close them at bedtime.
  triggers:
  - trigger: time
    at: input_datetime.alarm
    id: alarm
  - trigger: time
    at: input_datetime.go_to_bed
    id: go_to_bed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: alarm
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
        data:
          position: 80
    - conditions:
      - condition: trigger
        id: go_to_bed
      sequence:
      - action: cover.close_cover
        target:
          entity_id:
          - cover.persiana_estudio
          - cover.persiana_dario
  mode: single
