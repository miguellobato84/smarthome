- id: '1763817999770'
  alias: auto_radiadores
  description: Smart mode applies the automatic schedule; when Smart mode is off, manual radiator control is preserved. The global radiator switch still forces every radiator off.
  triggers:
    - trigger: time_pattern
      minutes: /30
    - trigger: homeassistant
      event: start
      id: startup
    - trigger: state
      entity_id:
        - climate.radiador_dormitorio
        - climate.radiador_dario
        - climate.radiador_estudio
        - climate.radiador_entrada
        - climate.radiador_salon
      from: unavailable
      id: radiator_reconnected
    - trigger: state
      entity_id:
        - input_boolean.radiador_dormitorio_auto
        - input_boolean.radiador_dario_auto
        - input_boolean.radiador_estudio_auto
        - input_boolean.radiador_entrada_auto
        - input_boolean.radiador_salon_auto
        - input_boolean.enable_radiators
    - trigger: state
      entity_id:
        - light.luz_abuelo
        - binary_sensor.workday_sensor_es_md
    - trigger: state
      entity_id:
        - input_number.radiador_dormitorio_target
        - input_number.radiador_dario_target
        - input_number.radiador_estudio_target
        - input_number.radiador_entrada_target
        - input_number.radiador_salon_target
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - startup
                - radiator_reconnected
          sequence:
            - action: script.set_radiador_config
              data:
                option: remote_temperature
    - action: script.update_radiador_external_temperatures
    - choose:
        # Global disable wins first: when enable_radiators is off, every radiator is forced off.
        - conditions:
            - condition: state
              entity_id: input_boolean.enable_radiators
              state: 'off'
          sequence:
            - action: script.set_radiador
              data:
                entity:
                  - climate.radiador_dormitorio
                  - climate.radiador_dario
                  - climate.radiador_estudio
                  - climate.radiador_entrada
                  - climate.radiador_salon
                heating: false
      default:
        # Only Smart-enabled radiators follow the automatic schedule; manual mode leaves them untouched.
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.radiador_dormitorio_auto
                  state: 'on'
              sequence:
                - action: script.set_radiador
                  data:
                    entity: climate.radiador_dormitorio
                    heating: "{{ 18 <= now().hour < 20 }}"
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.radiador_dario_auto
                  state: 'on'
              sequence:
                - action: script.set_radiador
                  data:
                    entity: climate.radiador_dario
                    heating: |
                      {% set hour = now().hour %}
                      {% if is_state('binary_sensor.workday_sensor_es_md', 'on') %}
                        {{ (7 <= hour < 9) or (17 <= hour < 20) }}
                      {% else %}
                        {{ 7 <= hour < 19 }}
                      {% endif %}
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.radiador_estudio_auto
                  state: 'on'
              sequence:
                - action: script.set_radiador
                  data:
                    entity: climate.radiador_estudio
                    heating: "{{ is_state('binary_sensor.workday_sensor_es_md', 'on') and 7 <= now().hour < 16 }}"
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.radiador_entrada_auto
                  state: 'on'
              sequence:
                - action: script.set_radiador
                  data:
                    entity: climate.radiador_entrada
                    heating: "{{ 7 <= now().hour < 22 or is_state('light.luz_abuelo', 'on') }}"
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.radiador_salon_auto
                  state: 'on'
              sequence:
                - action: script.set_radiador
                  data:
                    entity: climate.radiador_salon
                    heating: "{{ 7 <= now().hour < 22 or is_state('light.luz_abuelo', 'on') }}"
  mode: single
