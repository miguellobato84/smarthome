type: sections
max_columns: 4
title: blinds
path: persianas
sections:
- type: grid
  cards:
  - type: heading
    heading: Blinds
    tap_action:
      action: navigate
      navigation_path: /dashboard-wallpanel/0
    icon: mdi:arrow-left
    heading_style: title
    card_mod:
      style: |
        ha-icon-next {
          display: none !important;
        }
  - type: custom:mushroom-template-card
    entity: automation.persiana_estudio
    primary: Automatic blinds
    secondary: Weekdays · open to 90% at alarm · close 1h after dusk
    icon: mdi:blinds
    icon_color: "{{ 'yellow' if is_state(entity, 'on') else 'red' }}"
    multiline_secondary: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    grid_options:
      columns: 8
      rows: 1
  - type: tile
    entity: cover.persiana_dormitorio_small
    name: Bedroom small blind (read-only)
    features_position: bottom
    vertical: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    icon_tap_action:
      action: none
    icon_hold_action:
      action: none
    icon_double_tap_action:
      action: none
    grid_options:
      columns: 8
      rows: 1
  - type: tile
    entity: cover.persiana_dario
    icon_tap_action:
      action: perform-action
      perform_action: script.toggle_blind
      data:
        entity: cover.persiana_dario
    name: Dario blind
    features_position: bottom
    vertical: false
    features:
    - type: cover-position
    grid_options:
      columns: 8
      rows: 1
  - type: tile
    entity: cover.persiana_estudio
    icon_tap_action:
      action: perform-action
      perform_action: script.toggle_blind
      data:
        entity: cover.persiana_estudio
    name: Office blind
    features_position: bottom
    vertical: false
    features:
    - type: cover-position
    grid_options:
      columns: 8
      rows: 1
  column_span: 4
cards: []
dense_section_placement: true
